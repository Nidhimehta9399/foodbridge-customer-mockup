<!doctype html>
<!--
  DISCOVERY SCREEN — Foodbridge Module Customer — "Stock Audit & Health"
  -----------------------------------------------------------------------
  A distributor field-operations hub, mobile-first, listed under Customer
  Management as a peer of B2B Customers and Retail Customers — not a drawer,
  not a one-off tool. v1 is otherwise a frozen snapshot; this is the one
  deliberate exception, called out rather than silently edited in.

  UI/UX and theme are carried over from the platform's Distribution &
  Logistics → Delivery Management module on purpose (teal chrome, colour
  tiles, status-tag pills, card lists — never a dense table, this is a
  field tool) — including, per the product owner's explicit ask, Delivery
  Management's own persistent bottom nav bar. It stays on screen through
  EVERY view in this feature (`.sah-nav` in stock-audit.css), not just on
  mobile widths, so a rep always has Customers / Audits / + New Audit /
  Attention / Back within thumb's reach.

  One route (?customer=<id> optional), many views, run by a small
  stack-based router in stock-audit.js (go/back, mirroring Delivery
  Management's own DM.go/DM.back) — see that file's header for the full
  view list. The UX loop:

    Who needs attention → Why → What should I do next → Start Audit
    Create Visit → Understand Customer → Audit Stock → Capture Exceptions
      → Complete Audit → Get Actions → Build Customer History

  Mounts through shell.js's mountShell (sidebar, topbar, drawer/toast
  primitives) exactly like b2b-customers.html and retail-customers.html —
  it does NOT stand alone or open in a new tab; ?customer=<id> is only a
  deep link into the customer-detail view, not a separate page.

  Standalone-openable: open this file directly (optionally with
  ?customer=c01/c05/c11 for the richer seed data) to review in isolation.
  Data comes from seed.inline.js, same seed as the rest of the module;
  audits persist to localStorage for the session, same convention as
  customers.js's Store.

  Rules: HTML/CSS/vanilla JS only. No frameworks, no build step, no real API
  calls.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Audit &amp; Health — Foodbridge Module Customer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stock-audit.css?v=20260822i">
</head>
<body>
  <div class="app sah" id="app"></div>
  <script src="icons.js"></script>
  <script src="seed.inline.js"></script>
  <script src="shell.js"></script>
  <!-- ?v= busts the browser cache when this feature's own two files change —
       they iterate faster than the rest of the module and, unlike it, ship
       no build step to fingerprint them automatically. Bump the tag on any
       edit to stock-audit.css/.js. -->
  <script src="stock-audit.js?v=20260822i"></script>
  <script>SAH.mount();</script>
</body>
</html>
